<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#2c2444"><title>Una galaxia para Valeria</title><meta name="description" content="Una galaxia interactiva en colores pastel para Valeria."><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#211a38;color:#fff;font-family:'DM Sans',sans-serif}#galaxy{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}#galaxy:active{cursor:grabbing}.intro{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 48%,rgba(255,226,146,.18),rgba(48,35,76,.95) 68%);transition:opacity 1s,visibility 1s}.intro.away{opacity:0;visibility:hidden}.card{text-align:center;max-width:640px}.overline{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:#ffe893}.card h1{font:700 clamp(4.2rem,17vw,8.4rem)/.86 Fraunces,serif;margin:.16em 0;color:#fff1a9;text-shadow:0 0 45px rgba(255,220,115,.32)}.card p{line-height:1.8;color:#f2ebff;max-width:540px;margin:20px auto 30px}.enter{border:1px solid #fff0ae;background:linear-gradient(135deg,#ffe88d,#e8b9f1);color:#40304c;border-radius:999px;padding:15px 27px;font-weight:700;cursor:pointer;box-shadow:0 13px 48px rgba(240,199,255,.22)}.ui{position:fixed;z-index:5;inset:0;pointer-events:none}.title{position:absolute;top:max(20px,env(safe-area-inset-top));left:24px}.title small{display:block;color:#ffe994;letter-spacing:.18em;text-transform:uppercase;font-size:.66rem}.title strong{font:700 2rem Fraunces,serif;color:#fff}.hint{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translate(-50%,18px);background:rgba(46,35,70,.68);border:1px solid rgba(255,236,161,.3);backdrop-filter:blur(14px);padding:11px 17px;border-radius:999px;font-size:.75rem;opacity:0;transition:.5s;text-align:center;white-space:nowrap}.hint.show{opacity:1;transform:translate(-50%,0)}.music{position:absolute;right:18px;top:max(18px,env(safe-area-inset-top));pointer-events:auto;border:1px solid rgba(255,236,161,.35);background:rgba(46,35,70,.68);color:#fff6ca;border-radius:999px;padding:10px 14px;backdrop-filter:blur(14px);cursor:pointer}.message{width:min(540px,calc(100% - 34px));border:1px solid rgba(255,236,161,.38);border-radius:30px;padding:0;background:rgba(48,37,72,.94);color:white;box-shadow:0 28px 110px rgba(31,20,50,.65);backdrop-filter:blur(22px)}.message::backdrop{background:rgba(29,20,46,.56);backdrop-filter:blur(5px)}.message-inner{text-align:center;padding:42px 32px 34px}.flower-mark{color:#ffe780;font-size:2rem}.message h2{font:700 clamp(2.1rem,8vw,3.8rem)/1 Fraunces,serif;color:#fff0a8;margin:.3em 0}.message p{line-height:1.85;color:#f3edff;margin:0 auto 26px}.close{border:0;background:linear-gradient(135deg,#ffe783,#e9c1f3);color:#46354f;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer}.burst{position:fixed;z-index:20;pointer-events:none;color:#fff0a0;text-shadow:0 0 13px #efcaff;animation:burst 1.15s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2) rotate(160deg);opacity:0}}@media(max-width:540px){.title{left:16px}.title strong{font-size:1.55rem}.card p{font-size:.93rem}.message-inner{padding:35px 24px 28px}}@media(prefers-reduced-motion:reduce){.intro{transition:none}.burst{display:none}}
</style><style>.zoom-controls{position:absolute;right:18px;bottom:max(24px,env(safe-area-inset-bottom));display:grid;gap:8px;pointer-events:auto}.zoom-controls button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,236,161,.42);background:rgba(46,35,70,.74);color:#fff6ca;font-size:1.55rem;line-height:1;backdrop-filter:blur(14px);cursor:pointer;box-shadow:0 8px 28px rgba(31,20,50,.2)}.zoom-controls button:active{transform:scale(.93)}</style></head><body><canvas id="galaxy" aria-label="Galaxia interactiva. Arrastra para girarla, usa dos dedos para acercarla y toca una flor para leer su mensaje."></canvas><section class="intro" id="intro"><div class="card"><div class="overline">Un cielo pastel solo para ti</div><h1>Valeria</h1><p>Mueve y acerca la galaxia con tu dedo o cursor. Explora rosas, girasoles, tulipanes, margaritas y ramos amarillos; cada uno guarda una frase bonita.</p><button class="enter" id="enter">Entrar a tu galaxia ♡</button></div></section><div class="ui"><div class="title"><small>Galaxia pastel</small><strong>Para Valeria</strong></div><div class="hint" id="hint">Arrastra · Pellizca para acercar · Toca una flor</div><button class="music" id="music" hidden aria-pressed="true">♫ Pausar</button><div class="zoom-controls"><button id="zoom-in" aria-label="Acercar galaxia">＋</button><button id="zoom-out" aria-label="Alejar galaxia">−</button></div></div><dialog class="message" id="message"><div class="message-inner"><div class="flower-mark">♡</div><h2 id="message-title"></h2><p id="message-text"></p><button class="close" id="close-message">Seguir explorando</button></div></dialog><script>window.GIFT_CONFIG={name:'Valeria',accent:'#ffe58d',glow:'#f4c5ff',flower:'#ffe17b',flower2:'#f4ccff',center:'#a06e70',dust:'#e3dcff',bgCenter:'#6a578d',bgMid:'#35284f',bgEdge:'#171126',core:'rgba(255,239,166,.62)',coreSoft:'rgba(238,197,255,.22)',messages:[{title:'Eres luz',text:'Hay personas que iluminan sin intentarlo. Tú eres una de ellas: tu manera de estar puede hacer que un día cualquiera se sienta especial.'},{title:'Tu sonrisa',text:'Tu sonrisa tiene esa magia bonita que transforma el ambiente y hace sentir bien a quienes tienen la suerte de verla.'},{title:'No lo olvides',text:'Eres valiosa por quien eres, no por todo lo que haces por los demás. Tu presencia por sí sola ya significa mucho.'},{title:'Para los días difíciles',text:'Incluso cuando no puedas ver tu propia luz, sigue ahí. Respira, descansa y recuerda que no tienes que poder con todo al mismo tiempo.'},{title:'Lo bonito de ti',text:'Tu sensibilidad, tu forma de escuchar y tu manera de querer son regalos. Nunca dejes que el mundo te convenza de lo contrario.'},{title:'Un deseo',text:'Deseo que lleguen a ti personas, lugares y momentos que se sientan como paz, hogar y alegría verdadera.'},{title:'Sigue soñando',text:'Que nunca te falten sueños que te emocionen, fuerzas para perseguirlos y alguien que celebre contigo cuando se hagan realidad.'},{title:'Para Valeria',text:'Esta galaxia guarda un mensaje en cada flor, pero todas dicen lo mismo: eres especial y mereces cosas muy bonitas.'}]};</script><script src="galaxy.js"></script></body></html>
